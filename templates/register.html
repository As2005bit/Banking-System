<!DOCTYPE html>
<html>
<head>

<title>Create Account</title>
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
<div class="login">

<div class="login-box">

<h1>Create Account</h1>
{% if error %}

<div class="error">
{{ error }}
</div>
{% endif %}

<form method="POST">

<input
name="account_number"
placeholder="Account Number"
required>

<input
name="name"
placeholder="Full Name"
required>
<input
type="email"
name="email"
placeholder="Email"
required>

<input
name="phone"
placeholder="Phone Number"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>
Create Account
</button>

</form>

<p>
<a href="/">
Back to Login
</a>
</p>
</div>

</div>
</body>

</html>
